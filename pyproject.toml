# Settings for the checks on the Python tools, which `make pycheck` runs
[project]
name = "mariogolf64-tools"
version = "0"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
include = ["tools/*.py"]
# progress_map.py is a copy of a tool kept elsewhere, changed only in its
# settings
extend-exclude = ["tools/progress_map.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # The formatter handles these; ruff warns that they conflict with it.
  "COM812",
  "ISC001",
  # These conflict with D211 and D212, which are kept.
  "D203",
  "D213",
  # The tools are command-line programs, whose output is what they print.
  "T201",
  # The project has no copyright notices.
  "CPY001",
  # The tools run the build's own programs, found on PATH, with arguments
  # they build themselves.
  "S603",
  "S607",
]

[tool.ruff.lint.per-file-ignores]
# Libraries that the tools import, rather than tools of their own
"tools/character_model_format.py" = ["INP001"]
"tools/f3dex2.py" = ["INP001"]
# Blender finds operators and panels by names such as MG64_OT_export, and
# reads bl_options as a class attribute
"tools/blender/**" = ["N801", "RUF012"]
# The add-on's tests run inside Blender, which has no test runner, so they
# check with assert
"tools/blender/tests/*" = ["INP001", "S101"]
# The tools' tests are modules that unittest finds on its own, and use its
# assertions, as the project runs them with the standard library alone
"tools/tests/*" = ["INP001", "PT009", "PT027"]

[tool.ruff.lint.isort]
# The tools import each other, since Python puts a script's directory on
# the path
known-first-party = [
  "asset_archive",
  "build_character",
  "character_model_format",
  "character_template",
  "decode_asset",
  "f3dex2",
  "fncompare",
  "heap_region",
  "lz_codec",
  "progress_report",
]

[tool.basedpyright]
include = ["tools"]
# The Blender add-on runs only inside Blender, whose bpy module has no stubs
# here, and declares its properties as annotations that aren't types;
# tools/blender/run_tests.sh tests it in Blender instead
exclude = ["tools/progress_map.py", "tools/blender", "**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "all"
venvPath = "."
venv = ".venv"
# The tools import each other, since Python puts a script's directory on
# the path
extraPaths = ["tools"]

[tool.vulture]
paths = ["tools", "vulture_whitelist.py"]
exclude = ["tools/progress_map.py"]
min_confidence = 60
sort_by_size = true
# The Blender add-on's tests run from the list @test adds them to, and
# Blender calls the methods its classes override
ignore_decorators = ["@test", "@override"]
