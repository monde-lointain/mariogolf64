options:
  basename: mariogolf64
  target_path: baserom.us.z64
  elf_path: build/mariogolf64.elf
  base_path: .
  platform: n64
  compiler: KMC

  find_file_boundaries: True
  header_encoding: ASCII

  ld_script_path: build/splat/mariogolf64.ld
  ld_dependencies: True
  reloc_addrs_path:
    - reloc_addrs.txt
  symbol_addrs_path:
    - symbol_addrs.txt
  undefined_funcs_auto_path: build/splat/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/splat/undefined_syms_auto.txt

  asm_path: asm
  src_path: src
  build_path: build
  asset_path: assets
  extensions_path: tools/splat_ext
  cache_path: build/splat/splat_cache.pickle

  create_undefined_funcs_auto: True
  create_undefined_syms_auto: True

  subalign: null
  section_order: [".text", ".data", ".rodata", ".bss"]
  auto_link_sections: [".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: True
  string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  asm_inc_header: ""
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  mips_abi_float_regs: o32
  gp_value: 0x0
  disasm_unknown: True
  named_regs_for_c_funcs: False
  hasm_in_src_path: True
  ld_bss_is_noload: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  ld_generate_symbol_per_data_segment: True

