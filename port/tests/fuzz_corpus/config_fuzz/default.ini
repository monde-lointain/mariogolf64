# Mario Golf's settings. Lines that start with # are comments.

[game]
rom =
pause_when_unfocused = true

[video]
scale = 0
fullscreen = false
present = mailbox

[window]
width = 0
height = 0
position =

[audio]
volume = 100

[controls]
a = X, pad:south
b = C, pad:west, pad:east
z = Z, pad:+lefttrigger
start = Return, pad:start
l = Q, pad:leftshoulder
r = W, pad:rightshoulder, pad:+righttrigger
c_up = I, pad:north, pad:-righty
c_down = K, pad:+righty
c_left = J, pad:-rightx
c_right = L, pad:+rightx
d_up = T, pad:dpup
d_down = G, pad:dpdown
d_left = F, pad:dpleft
d_right = H, pad:dpright
stick_up = Up, pad:-lefty
stick_down = Down, pad:+lefty
stick_left = Left, pad:-leftx
stick_right = Right, pad:+leftx
stick_dead_zone = 7000
stick_full_throw = 30000
stick_range = 80
