name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-latest

    # PUBLIC repo: never run the ROM-baked container for fork PRs. The build runs
    # PR-controlled make/scripts, which could exfiltrate /orig/baserom.z64. Limit
    # to same-repo pushes and same-repo PRs. (Forks also never receive GHCR_PAT,
    # so the container pull would fail anyway; this makes it a clean skip.)
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read

    # Private build image with the baserom baked in at /orig/. See docker/.
    container:
      image: ghcr.io/monde-lointain/mariogolf64-build:main
      credentials:
        username: monde-lointain
        password: ${{ secrets.GHCR_PAT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.14"
          enable-cache: true

      # The ROM remains private; target compiler sources come from this checkout.
      - name: Provide baserom
        run: cp /orig/baserom.z64 baserom.z64

      - name: Configure CMake
        run: cmake --preset us

      - name: Build + verify ROM SHA-1
        run: tools/verify-rom.sh

  # ROM-free advisory analysis is safe for fork PRs.
  lint:
    name: Python static analysis (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.14"
          enable-cache: true

      - name: Install Python tooling
        run: uv sync --locked

      - name: ruff format --check
        continue-on-error: true
        run: uv run --locked ruff format --check tools tests/tooling

      - name: ruff check
        continue-on-error: true
        run: uv run --locked ruff check tools tests/tooling

      - name: vulture (dead code)
        continue-on-error: true
        run: uv run --locked vulture
