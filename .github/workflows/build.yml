name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-latest

    # PUBLIC repo: never run the ROM-baked container for fork PRs. The build runs
    # PR-controlled make/scripts, which could exfiltrate /orig/baserom.z64. Limit
    # to same-repo pushes and same-repo PRs. (Forks also never receive GHCR_PAT,
    # so the container pull would fail anyway; this makes it a clean skip.)
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read

    # Private build image with the baserom baked in at /orig/. See docker/.
    container:
      image: ghcr.io/monde-lointain/mariogolf64-build:main
      credentials:
        username: monde-lointain
        password: ${{ secrets.GHCR_PAT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Provide baserom
        run: cp /orig/baserom.z64 baserom.z64

      - name: Install KMC toolchain
        run: make -C tools

      - name: Install Python deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements.txt

      - name: Build + verify ROM SHA-1
        run: PATH="$(pwd)/.venv/bin:$PATH" ./tools/build-and-verify.sh

      - name: Report progress
        shell: bash  # -o pipefail: a failing report must fail the step through tee
        run: |
          {
            echo '```'
            PATH="$(pwd)/.venv/bin:$PATH" python3 tools/progress.py --segments -o report.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload progress report artifact
        uses: actions/upload-artifact@v4
        with:
          name: us_report
          path: report.json
