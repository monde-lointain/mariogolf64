candidate_source: tools/sync-shard && python3 tools/difficulty_ledger.py harvest && python3 tools/score_functions.py asm/nonmatchings --json --by-similarity --top-n 5 --tier 3
prompt: "Use the decompile-function skill to decompile the function: $INPUT[0]. This function failed at tier 2 with a best match of at least 90 percent; check its history with python3 tools/difficulty_ledger.py show and read the recorded reasons first. Try all strategies, do not give up. The matched functions most similar to it are references: $INPUT[1:]. When creating the decomp environment (tools/decomp-env) use --id $TASK_ID. Follow the skill's stop rules, including the difficulty-ledger record step at every stop."
agent_flags: --model openai-codex/gpt-6-luna:xhigh
success_command: 'f=${NIGEL_CANDIDATE#\[\"}; git add -u && { git diff --cached --quiet || git commit -m "Decompile ${f%%\"*}"; }'
verify_command: "./tools/verify-candidate --decompiled $CANDIDATE"
timeout: 240m
