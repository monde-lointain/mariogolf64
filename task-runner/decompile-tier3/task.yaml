candidate_source: tools/sync-shard && python3 tools/difficulty_ledger.py harvest && python3 tools/score_functions.py asm/nonmatchings --json --by-similarity --top-n 5 --tier 3
prompt: "Use the decompile-function skill to decompile the function: $INPUT[0]. It failed at tier 2 with a best match of at least 90 percent: read its recorded reasons with python3 tools/difficulty_ledger.py show first, then try every approach in the matching method that those attempts did not. Matched functions similar to it, useful as references: $INPUT[1:]. Create the environment with tools/decomp-env --id $TASK_ID. Stop at the first stop rule that applies and report in at most 10 lines."
agent_flags: --model anthropic/claude-haiku-5-5:xhigh
success_command: 'f=${NIGEL_CANDIDATE#\[\"}; git add -u && { git diff --cached --quiet || git commit -m "Decompile ${f%%\"*}"; }'
verify_command: "./tools/verify-candidate --decompiled $CANDIDATE"
timeout: 240m
