candidate_source: tools/sync-shard && python3 tools/difficulty_ledger.py harvest && python3 tools/score_functions.py asm/nonmatchings --json --by-similarity --top-n 5 --tier 2
prompt: "Decompile $INPUT[0]. It failed at tier 1; its brief lists those attempts under <prior_attempts>. Create its environment with `tools/decomp-env --bootstrap-only --id $TASK_ID --refs '$INPUT[1:]' $INPUT[0]` (the references are matched functions similar to it), then read nonmatchings/$INPUT[0]-$TASK_ID/AGENTS.md and follow it to the end. When progress plateaus, rewrite the function from the assembly rather than patching the same attempt."
agent_flags: --model anthropic/claude-haiku-5-5:xhigh
success_command: 'f=${NIGEL_CANDIDATE#\[\"}; git add -u && { git diff --cached --quiet || git commit -m "Decompile ${f%%\"*}"; }'
verify_command: "./tools/verify-candidate --decompiled $CANDIDATE"
timeout: 120m
