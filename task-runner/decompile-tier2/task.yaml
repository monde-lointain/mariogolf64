candidate_source: tools/sync-shard && python3 tools/difficulty_ledger.py harvest && python3 tools/score_functions.py asm/nonmatchings --json --tier 2
prompt: "Decompile $INPUT. It failed at tier 1; its brief lists those attempts under <prior_attempts>. Create its environment with `tools/decomp-env --bootstrap-only --id $TASK_ID $INPUT`, then read nonmatchings/$INPUT-$TASK_ID/AGENTS.md and follow it to the end. When progress plateaus, rewrite the function from the assembly rather than patching the same attempt."
agent_flags: --model anthropic/claude-haiku-5-5:xhigh
success_command: 'git add -u && git add src include && { git diff --cached --quiet || git commit -m "Decompile $NIGEL_CANDIDATE"; }'
verify_command: "./tools/verify-candidate --decompiled $CANDIDATE"
timeout: 120m
