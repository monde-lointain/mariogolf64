candidate_source: python3 tools/list_unconsolidated_learnings.py --json
accept_best_effort: true
prompt: "Consolidate the per-function learnings note $INPUT into the KMC GCC reference. Read the note, then docs/reference/kmc-gcc/index.md and the concept files it lists. Keep only generalizable lessons about how KMC GCC 2.7.2 compiles C, and only where you verify the claim yourself: compile a small probe with tools/gcc_kmc/gcc using the base profile flags in docs/project/compiler-profiles.md, writing outputs under /tmp. Add each verified lesson to the matching concept file in docs/reference/kmc-gcc/ in that file's style, and correct existing text the note refutes. Discard function-specific observations, and do not import anything that conflicts with docs/project/code-quality.md or docs/project/matching-method.md (fixed-register locals, empty or narrow inline asm barriers, volatile to retain stack space). Only edit files under docs/reference/kmc-gcc/; do not edit docs/log.md. Do not run make, ./tools/build-and-verify.sh, or nigel. Do not commit. When finished, run python3 tools/list_unconsolidated_learnings.py --mark $INPUT so the note is not offered again."
success_command: 'git add docs/reference/kmc-gcc && { git diff --cached --quiet || git commit -q -m "consolidate learnings: $CANDIDATE"; }'
timeout: 30m
