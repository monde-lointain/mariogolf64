candidate_source: python3 tools/difficulty_ledger.py harvest && python3 tools/score_functions.py asm/nonmatchings --json
prompt: "Use the decompile-function skill to decompile the function: $INPUT. Find references first: python3 tools/score_functions.py asm/nonmatchings --json --by-similarity --top-n 3 --score-func $INPUT lists the most similar matched functions. Create the environment with tools/decomp-env --id $TASK_ID. Stop at the first stop rule that applies and report in at most 10 lines."
agent_flags: --model anthropic/claude-haiku-5-5:xhigh
success_command: 'f=${NIGEL_CANDIDATE#\[\"}; git add -u && { git diff --cached --quiet || git commit -m "Decompile ${f%%\"*}"; }'
verify_command: "./tools/verify-candidate --decompiled $CANDIDATE"
timeout: 60m
