candidate_source: tools/sync-shard && python3 tools/difficulty_ledger.py harvest && python3 tools/score_functions.py asm/nonmatchings --json --by-coddog-similarity
prompt: "Use the decompile-function skill to decompile the function: $INPUT[0]. There are several similar functions that have been matched, they might provide a useful reference: $INPUT[1]. When creating the decomp environment (tools/decomp-env) use --id $TASK_ID. Follow the skill's stop rules, including the difficulty-ledger record step at every stop."
agent_flags: --model openai-codex/gpt-6-luna:xhigh
success_command: 'f=${NIGEL_CANDIDATE#\[\"}; git add -u && git commit -m "Decompile ${f%%\"*}"'
verify_command: "./tools/verify-candidate --decompiled $CANDIDATE"
timeout: 60m
