candidate_source: python3 tools/score_functions.py asm/nonmatchings --json --by-coddog-similarity
prompt: "Use the decompile-function skill to decompile the function: $INPUT[0]. There are several similar functions that have been matched, they might provide a useful reference: $INPUT[1]. If a function is only available on one worktree, that worktree will be indicated in parentheses, e.g. `myFunction (../mg64-a)`. When creating the decomp environment (tools/decomp-env) use --id $TASK_ID."
agent_flags: --thinking xhigh
success_command: 'git add -u && git commit -m "matched $CANDIDATE"'
timeout: 60m
