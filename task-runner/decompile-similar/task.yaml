candidate_source: tools/sync-shard && python3 tools/difficulty_ledger.py harvest && python3 tools/score_functions.py asm/nonmatchings --json --by-similarity --top-n 3
prompt: "Use the decompile-function skill to decompile the function: $INPUT[0]. These similar functions have been matched and might provide useful references: $INPUT[1:]. When creating the decomp environment (tools/decomp-env) use --id $TASK_ID. Come up with your own match by carefully considering the purpose of the function (and therefore what it must / must not logically do) and comparing it with the provided references. Follow the skill's stop rules, including the difficulty-ledger record step at every stop."
agent_flags: --model openai-codex/gpt-6-luna:xhigh
success_command: 'f=${NIGEL_CANDIDATE#\[\"}; git add -u && { git diff --cached --quiet || git commit -m "Decompile ${f%%\"*}"; }'
verify_command: "./tools/verify-candidate --decompiled $CANDIDATE"
timeout: 60m
