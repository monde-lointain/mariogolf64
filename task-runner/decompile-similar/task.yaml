candidate_source: tools/sync-shard && python3 tools/difficulty_ledger.py harvest && python3 tools/score_functions.py asm/nonmatchings --json --by-similarity --top-n 3
prompt: "Use the decompile-function skill to decompile the function: $INPUT[0]. Matched functions similar to it, useful as references: $INPUT[1:]. Create the environment with tools/decomp-env --id $TASK_ID. Work out what the function is for, and so what it must and must not do, before comparing it with the references. Stop at the first stop rule that applies and report in at most 10 lines."
agent_flags: --model anthropic/claude-haiku-5-5:xhigh
success_command: 'f=${NIGEL_CANDIDATE#\[\"}; git add -u && { git diff --cached --quiet || git commit -m "Decompile ${f%%\"*}"; }'
verify_command: "./tools/verify-candidate --decompiled $CANDIDATE"
timeout: 60m
