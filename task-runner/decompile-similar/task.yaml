candidate_source: tools/sync-shard && python3 tools/difficulty_ledger.py harvest && python3 tools/score_functions.py asm/nonmatchings --json
prompt: "Decompile $INPUT. Create its environment with `tools/decomp-env --bootstrap-only --id $TASK_ID $INPUT`, then read nonmatchings/$INPUT-$TASK_ID/AGENTS.md and follow it to the end."
agent_flags: --model anthropic/claude-haiku-5-5:high
success_command: 'git add -u && { git diff --cached --quiet || git commit -m "Decompile $NIGEL_CANDIDATE"; }'
verify_command: "./tools/verify-candidate --decompiled $CANDIDATE"
timeout: 60m
