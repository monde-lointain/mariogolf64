candidate_source: "sed -nE 's/^[[:space:]]*-[[:space:]]*\\[(0x[0-9A-Fa-f]+),[[:space:]]*asm\\][[:space:]]*$/\\1/p' mariogolf64.yaml"
prompt: >-
  Convert the assembly-only subsegment at ROM offset $INPUT in
  mariogolf64.yaml into a C translation unit of INCLUDE_ASM stubs, so its
  functions can be decompiled one at a time. Run
  `tools/split_asm_segments.py --offset $INPUT` first. It rewrites only that
  yaml line to a `c` entry, runs ./tools/build-and-verify.sh, keeps the change
  only if the build passes and src/<segment>/<name>.c was generated, and
  otherwise restores mariogolf64.yaml and removes the C file it created. Do not
  hand-edit mariogolf64.yaml or write the C file unless the script fails. If
  the script prints FAILED, read the build log tail it prints and find the real
  boundary or alignment cause (section alignment, rodata, or functions the
  original file split differently), fix it in mariogolf64.yaml, and rerun the
  script. If that is not possible, restore the asm subsegment. Keep every
  INCLUDE_ASM on one line. Do not decompile functions in this task. Finish only
  when ./tools/build-and-verify.sh succeeds with the split in place, or when the
  subsegment is back to `asm`.
success_command: 'git add -A && git commit -m "split asm segment $CANDIDATE into C"'
timeout: 60m
