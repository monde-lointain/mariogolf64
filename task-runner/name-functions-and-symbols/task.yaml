candidate_source: ls -1 src/main/*.c src/mgu/*.c src/overlay_*/*.c
prompt: "Examine the functions defined in $INPUT. Consider whether their current name is appropriate. If not, rename them to something more descriptive and consistent with the rest of the codebase. Also, check symbols used in the source file and rename them if they are not descriptive. Use the rename-global skill to safely rename functions and symbols. Finally, consider whether the file itself is appropriately named; if you have a better name in mind, rename it with the rename-file skill. This may reveal inconsistencies in the project. You should follow these leads and not just try to create a bandaid solution. Commit your changes when you're done."
agent: codex
success_command: 'git add -A && git commit -m "name-functions-and-symbols: $CANDIDATE"'
