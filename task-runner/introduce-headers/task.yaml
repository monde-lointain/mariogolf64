candidate_source: ls -1 src/main/*.c src/mgu/*.c src/overlay_*/*.c
prompt: "Examine the functions defined in $INPUT. If they are not already declared in a header file, create a header file next to the source (src/<dir>/<file_name>.h) and declare them there. Ensure the header file has proper include guards and is named appropriately. This may reveal inconsistencies, where callers assume one type and the callee uses another. That is fine and expected, determine the correct type and refactor accordingly. Update the source file to include this new header. Update callers to use the new header. Run ./tools/build-and-verify.sh and commit your changes when you're done."
success_command: 'git add -A && git commit -m "Added header for $CANDIDATE"'
timeout: 30m
